<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CineFlix</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1020;color:#fff;font:16px Arial}
header{padding:70px 8%;background:linear-gradient(135deg,#171b43,#681d67)}
h1{font-size:clamp(2rem,6vw,4rem);margin:10px 0}
input,select{padding:14px;border:0;border-radius:10px;margin-top:20px}
input{width:min(650px,100%)}select{background:#1b2140;color:#fff}
.toolbar{padding:25px 8%}.grid{padding:0 8%;display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.card{background:#181d35;border:1px solid #343d69;border-radius:15px;padding:20px}
.card h2{color:#ffd166}.card p{color:#cbd0ed;line-height:1.5}
a{display:inline-block;background:#6745e8;color:#fff;padding:11px 15px;
border-radius:8px;text-decoration:none}
.notice{margin:35px 8%;color:#bbb}
</style>
</head>
<body>

<header>
<div style="color:#ffd166;letter-spacing:4px">CINEFLIX</div>
<h1>Filmes, séries, novelas e futebol</h1>
<p>Encontre conteúdos e acesse somente fontes oficiais.</p>
<input id="busca" placeholder="Buscar título, gênero ou tipo...">
</header>

<div class="toolbar">
<select id="tipo">
<option value="">Todos os tipos</option>
<option>Filme</option><option>Série</option>
<option>Novela</option><option>Futebol</option>
</select>
</div>

<main id="catalogo" class="grid"></main>

<p class="notice">
Este catálogo não hospeda cópias nem transmissões. Use somente links autorizados.
</p>

<script>
const conteudos=[
 {
  titulo:"Exemplo de filme oficial",
  tipo:"Filme",
  genero:"Drama",
  descricao:"Substitua este exemplo por um filme autorizado.",
  link:"https://www.youtube.com/"
 },
 {
  titulo:"Exemplo de série oficial",
  tipo:"Série",
  genero:"Aventura",
  descricao:"Adicione a plataforma oficial e a sinopse.",
  link:"https://www.youtube.com/"
 },
 {
  titulo:"Próximo jogo de futebol",
  tipo:"Futebol",
  genero:"Ao vivo",
  descricao:"Informe horário, competição e transmissão oficial.",
  link:"https://www.fifa.com/"
 }
];

function mostrar(){
 const busca=document.querySelector("#busca").value.toLowerCase();
 const tipo=document.querySelector("#tipo").value;

 const lista=conteudos.filter(item=>
  (!tipo||item.tipo===tipo)&&
  (`${item.titulo} ${item.tipo} ${item.genero}`
  .toLowerCase().includes(busca))
 );

 document.querySelector("#catalogo").innerHTML=lista.map(item=>`
  <article class="card">
   <small>${item.tipo} · ${item.genero}</small>
   <h2>${item.titulo}</h2>
   <p>${item.descricao}</p>
   <a href="${item.link}" target="_blank" rel="noopener">
    Acessar fonte oficial
   </a>
  </article>
 `).join("")||"<p>Nenhum resultado encontrado.</p>";
}

document.querySelector("#busca").oninput=mostrar;
document.querySelector("#tipo").onchange=mostrar;
mostrar();
</script>

</body>
</html>
