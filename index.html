<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CINEMAX</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap');

:root {
  --bg: #141414;
  --text: #f5f5f5;
  --muted: #a3a3a3;
  --red: #e50914;
  --nav-h: 68px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  line-height: 1.5;
}
a { color: inherit; text-decoration: none; }

/* NAVBAR */
.nav {
  position: fixed; inset: 0 0 auto 0; height: var(--nav-h);
  display: flex; align-items: center; gap: 2.5rem;
  padding: 0 4%;
  background: linear-gradient(to bottom, rgba(0,0,0,.85), transparent);
  z-index: 50;
  transition: background .3s;
}
.nav.solid { background: var(--bg); }
.logo {
  font-family: 'Bebas Neue', Impact, sans-serif;
  font-size: 2rem; letter-spacing: .08em; color: var(--red);
}
.menu { display: flex; gap: 1.4rem; font-size: .9rem; }
.menu a { color: #d0d0d0; transition: color .2s; }
.menu a:hover, .menu a.active { color: #fff; }
.menu a.active { font-weight: 600; }
.profile {
  margin-left: auto; width: 34px; height: 34px; border-radius: 6px;
  background: linear-gradient(135deg, #4f46e5, #06b6d4);
  display: grid; place-items: center; font-weight: 600;
}

/* HERO */
.hero {
  position: relative; min-height: 88vh;
  display: flex; align-items: center;
  padding: var(--nav-h) 4% 0;
  background:
    linear-gradient(to right, rgba(20,20,20,.95) 5%, rgba(20,20,20,.2) 70%),
    linear-gradient(to top, var(--bg) 2%, transparent 40%),
    var(--hero-bg);
}
.hero-content { max-width: 560px; }
.hero h1 {
  font-family: 'Bebas Neue', Impact, sans-serif;
  font-size: clamp(3.2rem, 9vw, 6.5rem);
  line-height: .95; letter-spacing: .02em; margin-bottom: 1rem;
}
.hero-meta { color: #46d369; font-weight: 600; margin-bottom: .8rem; }
.hero-meta span { color: var(--muted); font-weight: 400; margin-left: .8rem; }
.hero-desc { color: #e2e2e2; max-width: 48ch; margin-bottom: 1.6rem; }
.hero-actions { display: flex; gap: .8rem; flex-wrap: wrap; }
.btn {
  font: inherit; font-weight: 600; font-size: 1rem;
  padding: .7rem 1.6rem; border: 0; border-radius: 6px; cursor: pointer;
  transition: transform .15s, background .2s;
}
.btn:hover { transform: scale(1.04); }
.btn-play { background: #fff; color: #000; }
.btn-play:hover { background: #d9d9d9; }
.btn-info { background: rgba(109,109,110,.7); color: #fff; }
.btn-info:hover { background: rgba(109,109,110,.4); }
.btn:focus-visible, .arrow:focus-visible, .card:focus-visible {
  outline: 3px solid #fff; outline-offset: 3px;
}

/* ROWS */
main { margin-top: -6vh; position: relative; z-index: 2; padding-bottom: 3rem; }
.row { margin-bottom: 2.2rem; }
.row h2 { font-size: 1.25rem; font-weight: 600; padding: 0 4%; margin-bottom: .6rem; }
.row-wrap { position: relative; }
.track {
  display: flex; gap: 8px;
  overflow-x: auto; scroll-snap-type: x proximity;
  padding: 2.2rem 4% 3rem; margin: -2.2rem 0 -3rem;
  scrollbar-width: none;
}
.track::-webkit-scrollbar { display: none; }

.arrow {
  position: absolute; top: 2.2rem; bottom: 3rem; width: 4%;
  border: 0; background: rgba(20,20,20,.65); color: #fff;
  font-size: 2rem; cursor: pointer; z-index: 5;
  opacity: 0; transition: opacity .2s, background .2s;
}
.arrow.left { left: 0; } .arrow.right { right: 0; }
.row-wrap:hover .arrow { opacity: 1; }
.arrow:hover { background: rgba(20,20,20,.9); }

/* CARDS */
.card {
  position: relative; flex: 0 0 auto;
  width: clamp(130px, 17vw, 240px); aspect-ratio: 2 / 3;
  border-radius: 6px; overflow: hidden; cursor: pointer;
  scroll-snap-align: start;
  background: var(--poster);
  transition: transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s, opacity .3s, z-index 0s .3s;
}
.card .poster-title {
  position: absolute; inset: auto 0 0 0; padding: 2.5rem .8rem .8rem;
  font-family: 'Bebas Neue', Impact, sans-serif;
  font-size: 1.5rem; line-height: 1; letter-spacing: .03em;
  background: linear-gradient(to top, rgba(0,0,0,.75), transparent);
}
.card .info {
  position: absolute; inset: 0; padding: .9rem;
  display: flex; flex-direction: column; justify-content: flex-end; gap: .35rem;
  background: linear-gradient(to top, rgba(0,0,0,.95) 30%, rgba(0,0,0,.2));
  opacity: 0; transition: opacity .25s;
}
.info b { font-size: .95rem; }
.info small { color: var(--muted); }
.info .score { color: #46d369; font-weight: 600; font-size: .85rem; }
.info .mini { display: flex; gap: .4rem; margin-top: .2rem; }
.info .mini i {
  font-style: normal; width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center; font-size: .8rem;
  border: 1.5px solid #aaa; background: rgba(0,0,0,.4);
}
.info .mini i:first-child { background: #fff; color: #000; border-color: #fff; }

@media (hover: hover) {
  .track:hover .card { opacity: .55; }
  .card:hover, .card:focus-visible {
    opacity: 1; transform: scale(1.18); z-index: 10;
    box-shadow: 0 14px 40px rgba(0,0,0,.8); transition-delay: 0s;
  }
  .card:hover .info, .card:focus-visible .info { opacity: 1; }
  .card:first-child:hover { transform-origin: left center; }
  .card:last-child:hover { transform-origin: right center; }
}

.footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 2rem 4% 3rem; }

@media (max-width: 700px) {
  .menu a:not(.active) { display: none; }
  .hero { min-height: 75vh; }
  .arrow { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>

<header class="nav" id="nav">
  <a class="logo" href="#">CINEMAX</a>
  <nav class="menu">
    <a href="#" class="active">Início</a>
    <a href="#">Séries</a>
    <a href="#">Filmes</a>
    <a href="#">Novidades</a>
    <a href="#">Minha lista</a>
  </nav>
  <div class="profile" aria-label="Perfil">U</div>
</header>

<section class="hero" id="hero">
  <div class="hero-content">
    <h1 id="hero-title"></h1>
    <p class="hero-meta" id="hero-meta"></p>
    <p class="hero-desc" id="hero-desc"></p>
    <div class="hero-actions">
      <button class="btn btn-play">▶ Assistir</button>
      <button class="btn btn-info">Mais informações</button>
    </div>
  </div>
</section>

<main id="rows"></main>

<footer class="footer">Projeto de estudo · todos os títulos e dados são fictícios</footer>

<script>
// ===== DADOS FICTÍCIOS =====
const hero = {
  title: "Noite Eterna",
  year: 2025, rating: "16+", match: 97, genre: "Ficção científica",
  desc: "Quando o sol deixa de nascer, uma engenheira e um ex-piloto precisam atravessar uma cidade em escuridão total para reativar a última usina de luz.",
  hue: 255
};

const categories = {
  "Populares": ["Código Zero", "A Última Estação", "Mares de Cinza", "Reino Partido", "Luz do Norte", "O Colecionador", "Vento Sul", "Fronteira"],
  "Ação": ["Velocidade Crítica", "Linha de Fogo", "Operação Falcão", "Ponto Cego", "Retorno Sombrio", "Alvo Móvel", "Tempestade Rubra", "Resgate 9"],
  "Comédia": ["Meu Vizinho Genial", "Casa Cheia", "Férias Perfeitas", "O Plano Furado", "Quase Famosos", "Domingo no Sítio", "Troca de Turno", "Festa Surpresa"],
  "Séries para maratonar": ["Os Herdeiros", "Plantão Noturno", "Cidade Submersa", "A Vila", "Sinal Aberto", "Detetive Moura", "Laços", "Ecos"],
  "Drama": ["Sob a Chuva", "Cartas Perdidas", "O Peso do Silêncio", "Rua das Palmeiras", "Outono em Casa", "Duas Vidas", "Horizonte", "A Promessa"]
};

// ===== FUNÇÕES AUXILIARES =====
function hash(str) {
  let h = 0;
  for (const c of str) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return h;
}
function fakeData(title) {
  const h = hash(title);
  return {
    title,
    hue: h % 360,
    year: 2015 + (h % 11),
    match: 70 + (h % 30),
    rating: ["L", "12+", "14+", "16+"][h % 4],
    mins: 85 + (h % 60)
  };
}
const posterBg = hue =>
  `linear-gradient(160deg, hsl(${hue} 70% 38%), hsl(${(hue + 50) % 360} 65% 14%))`;

// ===== HERO =====
const heroEl = document.getElementById("hero");
heroEl.style.setProperty("--hero-bg",
  `radial-gradient(circle at 75% 35%, hsl(${hero.hue} 80% 45% / .75), transparent 55%), hsl(${hero.hue} 50% 10%)`);
document.getElementById("hero-title").textContent = hero.title;
document.getElementById("hero-meta").innerHTML =
  `${hero.match}% relevante <span>${hero.year} · ${hero.rating} · ${hero.genre}</span>`;
document.getElementById("hero-desc").textContent = hero.desc;

// ===== FILEIRAS DE CARDS =====
const rowsEl = document.getElementById("rows");

Object.entries(categories).forEach(([name, titles]) => {
  const row = document.createElement("section");
  row.className = "row";
  row.innerHTML = `
    <h2>${name}</h2>
    <div class="row-wrap">
      <button class="arrow left" aria-label="Voltar">‹</button>
      <div class="track"></div>
      <button class="arrow right" aria-label="Avançar">›</button>
    </div>`;
  const track = row.querySelector(".track");

  titles.forEach(t => {
    const d = fakeData(t);
    const card = document.createElement("article");
    card.className = "card";
    card.tabIndex = 0;
    card.style.setProperty("--poster", posterBg(d.hue));
    card.innerHTML = `
      <div class="poster-title">${d.title}</div>
      <div class="info">
        <div class="mini"><i>▶</i><i>+</i><i>♥</i></div>
        <b>${d.title}</b>
        <span class="score">${d.match}% relevante</span>
        <small>${d.rating} · ${d.year} · ${d.mins} min</small>
      </div>`;
    track.appendChild(card);
  });

  const scrollBy = dir => track.scrollBy({ left: dir * track.clientWidth * 0.85, behavior: "smooth" });
  row.querySelector(".left").onclick = () => scrollBy(-1);
  row.querySelector(".right").onclick = () => scrollBy(1);

  rowsEl.appendChild(row);
});

// ===== NAVBAR MUDA AO ROLAR =====
const nav = document.getElementById("nav");
const onScroll = () => nav.classList.toggle("solid", window.scrollY > 40);
window.addEventListener("scroll", onScroll);
onScroll();
</script>
</body>
</html>
