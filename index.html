body {
  background-color: #060606;
  color: #ffffff;
  min-height: 100vh;
  overflow-x: hidden;
}

header {
  background: linear-gradient(180deg, rgba(15, 15, 15, 0.95) 0%, rgba(6, 6, 6, 0.8) 100%);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(0, 255, 102, 0.15);
  padding: 16px 5%;
}

.nav-container {
  max-width: 1300px;
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.logo {
  font-size: 1.8rem;
  font-weight: 800;
  letter-spacing: -0.5px;
  text-decoration: none;
  color: #ffffff;
  display: flex;
  align-items: center;
  gap: 6px;
}

.logo span {
  color: #00ff66;
  text-shadow: 0 0 12px rgba(0, 255, 102, 0.6);
}

.search-box {
  display: flex;
  align-items: center;
  background: #121212;
  border: 1px solid #222;
  border-radius: 50px;
  padding: 4px 6px 4px 18px;
  transition: all 0.3s ease;
  flex: 1;
  max-width: 480px;
}

.search-box:focus-within {
  border-color: #00ff66;
  box-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
}

.search-box input {
  background: transparent;
  border: none;
  outline: none;
  color: #fff;
  font-size: 0.95rem;
  width: 100%;
}

.search-box button {
  background: #00ff66;
  color: #060606;
  border: none;
  outline: none;
  padding: 8px 18px;
  border-radius: 50px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 6px;
}

.search-box button:hover {
  background: #33ff85;
  box-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
}

.tabs-wrapper {
  max-width: 1300px;
  margin: 24px auto 0;
  padding: 0 5%;
  display: flex;
  gap: 12px;
  overflow-x: auto;
  scrollbar-width: none;
}

.tabs-wrapper::-webkit-scrollbar {
  display: none;
}

.tab-btn {
  background: #141414;
  color: #aaa;
  border: 1px solid #262626;
  padding: 10px 22px;
  border-radius: 50px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.25s ease;
}

.tab-btn:hover {
  color: #ffffff;
  border-color: #00ff66;
  box-shadow: 0 0 8px rgba(0, 255, 102, 0.25);
}

.tab-btn.active {
  background: #00ff66;
  color: #060606;
  border-color: #00ff66;
  box-shadow: 0 0 15px rgba(0, 255, 102, 0.5);
}

#player-section {
  display: none;
  max-width: 1000px;
  margin: 24px auto;
  padding: 0 5%;
}

.player-card {
  background: #0f0f0f;
  border: 1px solid rgba(0, 255, 102, 0.3);
  box-shadow: 0 0 25px rgba(0, 255, 102, 0.15);
  border-radius: 16px;
  overflow: hidden;
}

.player-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px;
  background: #161616;
  border-bottom: 1px solid #242424;
}

.player-title {
  font-size: 1.15rem;
  font-weight: 700;
  color: #00ff66;
}

.btn-close-player {
  background: #ff2a2a;
  color: #ffffff;
  border: none;
  padding: 8px 16px;
  border-radius: 50px;
  font-weight: 700;
  font-size: 0.85rem;
  cursor: pointer;
  transition: background 0.2s, box-shadow 0.2s;
}

.btn-close-player:hover {
  background: #e01b1b;
  box-shadow: 0 0 12px rgba(255, 42, 42, 0.5);
}

.video-container {
  position: relative;
  width: 100%;
  padding-top: 56.25%;
  background: #000;
}

.video-container iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: none;
}

.player-info {
  padding: 16px 20px;
  font-size: 0.95rem;
  color: #ccc;
  line-height: 1.5;
}

main {
  max-width: 1300px;
  margin: 28px auto 60px;
  padding: 0 5%;
}

.section-title {
  font-size: 1.4rem;
  font-weight: 700;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.section-title::before {
  content: '';
  display: inline-block;
  width: 4px;
  height: 20px;
  background: #00ff66;
  border-radius: 2px;
  box-shadow: 0 0 8px #00ff66;
}

.media-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 22px;
}

.media-card {
  background: #111111;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid #1c1c1c;
  transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  position: relative;
}

.media-card:hover {
  transform: translateY(-6px);
  border-color: #00ff66;
  box-shadow: 0 10px 20px rgba(0, 255, 102, 0.25);
}

.card-poster {
  position: relative;
  width: 100%;
  padding-top: 145%;
  background: #1b1b1b;
  overflow: hidden;
}

.card-poster img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.35s ease;
}

.media-card:hover .card-poster img {
  transform: scale(1.05);
}

.badge-tag {
  position: absolute;
  top: 10px;
  left: 10px;
  background: rgba(0, 0, 0, 0.75);
  color: #00ff66;
  border: 1px solid rgba(0, 255, 102, 0.4);
  padding: 4px 8px;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 700;
  backdrop-filter: blur(4px);
  z-index: 2;
}

.card-content {
  padding: 14px;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.card-title {
  font-size: 0.95rem;
  font-weight: 700;
  color: #fff;
  margin-bottom: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-overview {
  font-size: 0.8rem;
  color: #888;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 10px;
  line-height: 1.4;
}

.card-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.8rem;
  color: #00ff66;
  font-weight: 600;
}

.loading-spinner {
  text-align: center;
  padding: 60px 0;
  font-size: 1.1rem;
  color: #00ff66;
}

footer {
  border-top: 1px solid #1a1a1a;
  text-align: center;
  padding: 24px 5%;
  color: #666;
  font-size: 0.85rem;
}

/* BANNER PRINCIPAL (HERO) */
.hero-banner {
  position: relative;
  width: 100%;
  height: 420px;
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: flex-end;
  padding: 40px 5%;
  margin-bottom: 25px;
  border-bottom: 1px solid #1a1a1a;
  transition: background-image 0.6s ease;
}

.hero-overlay {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(0deg, #060606 5%, rgba(6, 6, 6, 0.6) 50%, rgba(6, 6, 6, 0.8) 100%);
  z-index: 1;
}

.hero-content {
  position: relative;
  z-index: 2;
  max-width: 700px;
}

.hero-tag {
  display: inline-block;
  background: var(--accent);
  color: #060606;
  font-size: 0.75rem;
  font-weight: 800;
  padding: 4px 10px;
  border-radius: 20px;
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.hero-title {
  font-size: 2.2rem;
  font-weight: 800;
  line-height: 1.2;
  margin-bottom: 12px;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
}

.hero-overview {
  font-size: 0.95rem;
  color: #ddd;
  line-height: 1.5;
  margin-bottom: 18px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.hero-actions {
  display: flex;
  gap: 12px;
}

.btn-hero-play {
  background: var(--accent);
  color: #060606;
  border: none;
  padding: 10px 24px;
  border-radius: 50px;
  font-weight: 700;
  font-size: 0.95rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.25s ease;
}

.btn-hero-play:hover {
  background: var(--accent-hover);
  box-shadow: 0 0 16px var(--accent-glow);
}

/* ABAS DE NAVEGAÇÃO */
.tabs-bar {
  max-width: 1400px;
  margin: 0 auto 20px;
  padding: 0 4%;
  display: flex;
  gap: 10px;
  overflow-x: auto;
  scrollbar-width: none;
}

.tabs-bar::-webkit-scrollbar {
  display: none;
}

.tab-item {
  background: #131313;
  color: var(--text-muted);
  border: 1px solid #222222;
  padding: 10px 22px;
  border-radius: 50px;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.25s ease;
  display: flex;
  align-items: center;
  gap: 6px;
}

.tab-item:hover {
  color: #ffffff;
  border-color: var(--accent);
  box-shadow: 0 0 10px rgba(0, 255, 102, 0.25);
}

.tab-item.active {
  background: var(--accent);
  color: #060606;
  border-color: var(--accent);
  box-shadow: 0 0 16px var(--accent-glow);
  font-weight: 700;
}

/* SEÇÃO DO PLAYER */
#player-section {
  display: none;
  max-width: 1100px;
  margin: 15px auto 35px;
  padding: 0 4%;
  width: 100%;
}

.player-box {
  background: #0f0f0f;
  border: 1px solid rgba(0, 255, 102, 0.4);
  box-shadow: 0 0 30px rgba(0, 255, 102, 0.2);
  border-radius: 18px;
  overflow: hidden;
}

.player-topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 22px;
  background: #141414;
  border-bottom: 1px solid #222;
}

.player-header-title {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--accent);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding-right: 15px;
}

.btn-fechar {
  background: var(--danger);
  color: #ffffff;
  border: none;
  padding: 7px 18px;
  border-radius: 50px;
  font-weight: 700;
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}

.btn-fechar:hover {
  background: #e61919;
  box-shadow: 0 0 14px rgba(255, 42, 42, 0.6);
}

.responsive-video {
  position: relative;
  width: 100%;
  padding-top: 56.25%;
  background: #000;
}

.responsive-video iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: none;
}

.player-body {
  padding: 18px 22px;
  background: #0e0e0e;
}

.player-meta-tags {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
  font-size: 0.82rem;
}

.player-tag {
  background: #1a1a1a;
  border: 1px solid #333;
  padding: 3px 10px;
  border-radius: 12px;
  color: var(--accent);
}

.player-synopsis {
  font-size: 0.92rem;
  color: #ccc;
  line-height: 1.6;
}

/* CONTEÚDO PRINCIPAL */
main {
  max-width: 1400px;
  margin: 10px auto 60px;
  padding: 0 4%;
  flex: 1;
  width: 100%;
}

.heading-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
}

.title-category {
  font-size: 1.45rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 12px;
  letter-spacing: -0.3px;
}

.title-category::before {
  content: '';
  display: inline-block;
  width: 5px;
  height: 24px;
  background: var(--accent);
  border-radius: 3px;
  box-shadow: 0 0 10px var(--accent);
}

.count-indicator {
  font-size: 0.85rem;
  color: var(--text-muted);
  font-weight: 500;
}

.catalog-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
  gap: 24px;
}

/* CARD DE MÍDIA */
.card-item {
  background: var(--bg-card);
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid #1c1c1c;
  transition: transform 0.28s ease, box-shadow 0.28s ease, border-color 0.28s ease;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  position: relative;
}

.card-item:hover {
  transform: translateY(-8px);
  border-color: var(--accent);
  box-shadow: 0 12px 24px var(--accent-glow);
}

.card-thumb {
  position: relative;
  width: 100%;
  padding-top: 145%;
  background: #161616;
  overflow: hidden;
}

.card-thumb img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.4s ease;
}

.card-item:hover .card-thumb img {
  transform: scale(1.06);
}

.card-badge {
  position: absolute;
  top: 10px;
  left: 10px;
  background: rgba(6, 6, 6, 0.85);
  color: var(--accent);
  border: 1px solid rgba(0, 255, 102, 0.5);
  padding: 4px 9px;
  border-radius: 20px;
  font-size: 0.72rem;
  font-weight: 800;
  backdrop-filter: blur(6px);
  z-index: 2;
}

.card-audio-tag {
  position: absolute;
  top: 10px;
  right: 10px;
  background: rgba(0, 0, 0, 0.85);
  color: #fff;
  border: 1px solid #333;
  padding: 4px 7px;
  border-radius: 6px;
  font-size: 0.68rem;
  font-weight: 700;
  z-index: 2;
}

.card-info {
  padding: 15px;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.card-name {
  font-size: 0.98rem;
  font-weight: 700;
  color: #fff;
  margin-bottom: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-desc {
  font-size: 0.82rem;
  color: #8c8c8c;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 12px;
  line-height: 1.4;
}

.card-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.82rem;
  color: var(--accent);
  font-weight: 700;
}

.card-rating {
  display: flex;
  align-items: center;
  gap: 4px;
}

.state-message {
  text-align: center;
  padding: 70px 20px;
  color: var(--accent);
  font-size: 1.15rem;
  font-weight: 600;
  grid-column: 1 / -1;
}

/* FOOTER */
footer {
  border-top: 1px solid #181818;
  background: #080808;
  text-align: center;
  padding: 24px 4%;
  color: #777;
  font-size: 0.85rem;
  margin-top: auto;
}

@media (max-width: 768px) {
  .hero-banner {
    height: 340px;
    padding: 24px 4%;
  }
  .hero-title {
    font-size: 1.6rem;
  }
  .catalog-grid {
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
  }

  position: relative;
  z-index: 2;
  max-width: 700px;
}

.hero-tag {
  display: inline-block;
  background: var(--accent);
  color: #060606;
  font-size: 0.75rem;
  font-weight: 800;
  padding: 4px 10px;
  border-radius: 20px;
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.hero-title {
  font-size: 2.2rem;
  font-weight: 800;
  line-height: 1.2;
  margin-bottom: 12px;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
}

.hero-overview {
  font-size: 0.95rem;
  color: #ddd;
  line-height: 1.5;
  margin-bottom: 18px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.hero-actions {
  display: flex;
  gap: 12px;
}

.btn-hero-play {
  background: var(--accent);
  color: #060606;
  border: none;
  padding: 10px 24px;
  border-radius: 50px;
  font-weight: 700;
  font-size: 0.95rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.25s ease;
}

.btn-hero-play:hover {
  background: var(--accent-hover);
  box-shadow: 0 0 16px var(--accent-glow);
}

/* ABAS DE NAVEGAÇÃO */
.tabs-bar {
  max-width: 1400px;
  margin: 0 auto 20px;
  padding: 0 4%;
  display: flex;
  gap: 10px;
  overflow-x: auto;
  scrollbar-width: none;
}

.tabs-bar::-webkit-scrollbar {
  display: none;
}

.tab-item {
  background: #131313;
  color: var(--text-muted);
  border: 1px solid #222222;
  padding: 10px 22px;
  border-radius: 50px;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.25s ease;
  display: flex;
  align-items: center;
  gap: 6px;
}

.tab-item:hover {
  color: #ffffff;
  border-color: var(--accent);
  box-shadow: 0 0 10px rgba(0, 255, 102, 0.25);
}

.tab-item.active {
  background: var(--accent);
  color: #060606;
  border-color: var(--accent);
  box-shadow: 0 0 16px var(--accent-glow);
  font-weight: 700;
}

/* SEÇÃO DO PLAYER */
#player-section {
  display: none;
  max-width: 1100px;
  margin: 15px auto 35px;
  padding: 0 4%;
  width: 100%;
}

.player-box {
  background: #0f0f0f;
  border: 1px solid rgba(0, 255, 102, 0.4);
  box-shadow: 0 0 30px rgba(0, 255, 102, 0.2);
  border-radius: 18px;
  overflow: hidden;
}

.player-topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 22px;
  background: #141414;
  border-bottom: 1px solid #222;
}

.player-header-title {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--accent);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding-right: 15px;
}

.btn-fechar {
  background: var(--danger);
  color: #ffffff;
  border: none;
  padding: 7px 18px;
  border-radius: 50px;
  font-weight: 700;
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}

.btn-fechar:hover {
  background: #e61919;
  box-shadow: 0 0 14px rgba(255, 42, 42, 0.6);
}

.responsive-video {
  position: relative;
  width: 100%;
  padding-top: 56.25%;
  background: #000;
}

.responsive-video iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: none;
}

.player-body {
  padding: 18px 22px;
  background: #0e0e0e;
}

.player-meta-tags {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
  font-size: 0.82rem;
}

.player-tag {
  background: #1a1a1a;
  border: 1px solid #333;
  padding: 3px 10px;
  border-radius: 12px;
  color: var(--accent);
}

.player-synopsis {
  font-size: 0.92rem;
  color: #ccc;
  line-height: 1.6;
}

/* CONTEÚDO PRINCIPAL */
main {
  max-width: 1400px;
  margin: 10px auto 60px;
  padding: 0 4%;
  flex: 1;
  width: 100%;
}

.heading-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
}

.title-category {
  font-size: 1.45rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 12px;
  letter-spacing: -0.3px;
}

.title-category::before {
  content: '';
  display: inline-block;
  width: 5px;
  height: 24px;
  background: var(--accent);
  border-radius: 3px;
  box-shadow: 0 0 10px var(--accent);
}

.count-indicator {
  font-size: 0.85rem;
  color: var(--text-muted);
  font-weight: 500;
}

.catalog-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
  gap: 24px;
}

/* CARD DE MÍDIA */
.card-item {
  background: var(--bg-card);
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid #1c1c1c;
  transition: transform 0.28s ease, box-shadow 0.28s ease, border-color 0.28s ease;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  position: relative;
}

.card-item:hover {
  transform: translateY(-8px);
  border-color: var(--accent);
  box-shadow: 0 12px 24px var(--accent-glow);
}

.card-thumb {
  position: relative;
  width: 100%;
  padding-top: 145%;
  background: #161616;
  overflow: hidden;
}

.card-thumb img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.4s ease;
}

.card-item:hover .card-thumb img {
  transform: scale(1.06);
}

.card-badge {
  position: absolute;
  top: 10px;
  left: 10px;
  background: rgba(6, 6, 6, 0.85);
  color: var(--accent);
  border: 1px solid rgba(0, 255, 102, 0.5);
  padding: 4px 9px;
  border-radius: 20px;
  font-size: 0.72rem;
  font-weight: 800;
  backdrop-filter: blur(6px);
  z-index: 2;
}

.card-audio-tag {
  position: absolute;
  top: 10px;
  right: 10px;
  background: rgba(0, 0, 0, 0.85);
  color: #fff;
  border: 1px solid #333;
  padding: 4px 7px;
  border-radius: 6px;
  font-size: 0.68rem;
  font-weight: 700;
  z-index: 2;
}

.card-info {
  padding: 15px;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.card-name {
  font-size: 0.98rem;
  font-weight: 700;
  color: #fff;
  margin-bottom: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-desc {
  font-size: 0.82rem;
  color: #8c8c8c;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 12px;
  line-height: 1.4;
}

.card-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.82rem;
  color: var(--accent);
  font-weight: 700;
}

.card-rating {
  display: flex;
  align-items: center;
  gap: 4px;
}

.state-message {
  text-align: center;
  padding: 70px 20px;
  color: var(--accent);
  font-size: 1.15rem;
  font-weight: 600;
  grid-column: 1 / -1;
}

/* FOOTER */
footer {
  border-top: 1px solid #181818;
  background: #080808;
  text-align: center;
  padding: 24px 4%;
  color: #777;
  font-size: 0.85rem;
  margin-top: auto;
}

@media (max-width: 768px) {
  .hero-banner {
    height: 340px;
    padding: 24px 4%;
  }
  .hero-title {
    font-size: 1.6rem;
  }
  .catalog-grid {
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
  }
}
