<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MundoFlix Play - Filmes, Séries e Futebol</title>
    <!-- Video.js CSS para o reprodutor de canais/futebol -->
    <link href="https://zencdn.net" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #fff;
        }

        header {
            background-color: #000;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 3px solid #00ff66; /* Verde futebol */
        }

        header h1 {
            color: #00ff66;
            font-size: 2.2rem;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        /* Abas de Navegação */
        .nav-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            background: #222;
            color: white;
            border: 2px solid transparent;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: #00ff66;
            color: black;
            box-shadow: 0 0 10px #00ff66;
        }

        .search-container {
            width: 100%;
            max-width: 500px;
            display: flex;
        }

        input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 4px 0 0 4px;
            outline: none;
            background: #222;
            color: white;
        }

        button.search-btn {
            padding: 12px 24px;
            background-color: #00ff66;
            color: black;
            border: none;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-weight: bold;
        }

        /* Seção do Player de Vídeo */
        .player-section {
            display: none;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .player-wrapper {
            background: #000;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            position: relative;
        }

        .close-player {
            background: red;
            color: white;
            border: none;
            padding: 5px 10px;
            margin-bottom: 10px;
            cursor: pointer;
            border-radius: 4px;
            float: right;
        }

        iframe {
            width: 100%;
            height: 450px;
            border: none;
            background: #000;
        }

        /* Grade de Conteúdo */
        .container {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: #161616;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            border: 1px solid #222;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 255, 102, 0.2);
        }

        .card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .card-info {
            padding: 12px;
        }

        .card-info h3 {
            font-size: 0.95rem;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge {
            display: inline-block;
            background: #333;
            padding: 3px 6px;
            font-size: 0.75rem;
            border-radius: 4px;
            color: #ffc107;
        }

        .badge.live {
            background: #ff0044;
            color: white;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <header>
        <h1>MUNDOFLIX PLAY</h1>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('all', event)">Tudo</button>
            <button class="tab-btn" onclick="switchTab('futebol', event)">⚽ Futebol Ao Vivo</button>
            <button class="tab-btn" onclick="switchTab('movie', event)">🎬 Filmes</button>
            <button class="tab-btn" onclick="switchTab('tv', event)">📺 Séries</button>
        </div>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Filmes, séries ou canais de esporte...">
            <button class="search-btn" id="search-button">Buscar</button>
        </div>
    </header>

    <!-- Área do Reprodutor de Streaming -->
    <div class="player-section" id="player-section">
        <button class="close-player" onclick="closeVideo()">Fechar Player ✕</button>
        <h3 id="playing-title" style="margin-bottom:10px; color:#00ff66;">Assistindo</h3>
        <div class="player-wrapper" id="video-container">
            <!-- Os players de vídeo injetados via JS entrarão aqui -->
        </div>
    </div>

    <div class="container">
        <h2 id="section-title" style="margin-bottom: 20px;">Destaques Globais</h2>
        <div class="grid" id="main-grid"></div>
    </div>

    <!-- Scripts necessários para rodar canais de TV ao vivo (.m3u8) -->
    <script src="https://zencdn.net"></script>
    <script>
        // Configurações da API de Filmes/Séries (TMDB)
        // ⚠️ INSIRA SUA CHAVE DA API DO TMDB NA LINHA ABAIXO:
        const API_KEY = 'SUA_API_KEY_AQUI'; 
        
        const BASE_URL = 'https://themoviedb.org';
        const IMG_URL = 'https://tmdb.org';

        // BASE DE DADOS DOS JOGOS/CANAIS DE FUTEBOL (Exemplos de imagens ilustrativas)
        const CANAIS_FUTEBOL = [
            { id: 'fut1', name: "ESPN 1 Ao Vivo", type: "futebol", poster: "https://unsplash.com", video_url: "COLOQUE_AQUI_O_LINK_M3U8" },
            { id: 'fut2', name: "SporTV Global", type: "futebol", poster: "https://unsplash.com", video_url: "COLOQUE_AQUI_O_LINK_M3U8" },
            { id: 'fut3', name: "Real Madrid TV", type: "futebol", poster: "https://unsplash.com", video_url: "https://akamaihd.net" }
        ];

        let currentTab = 'all';
        const mainGrid = document.getElementById('main-grid');
        let videoPlayer = null;

        loadContent();

        async function loadContent() {
            mainGrid.innerHTML = '';
            
            if (currentTab === 'all' || currentTab === 'futebol') {
                renderFutebolCards(CANAIS_FUTEBOL);
            }

            if (currentTab !== 'futebol') {
                let url = `${BASE_URL}/trending/all/week?api_key=${API_KEY}&language=pt-BR`;
                if(currentTab === 'movie') url = `${BASE_URL}/movie/popular?api_key=${API_KEY}&language=pt-BR`;
                if(currentTab === 'tv') url = `${BASE_URL}/tv/popular?api_key=${API_KEY}&language=pt-BR`;

                try {
                    const res = await fetch(url);
                    const data = await res.json();
                    if(data.results) renderMediaCards(data.results);
                } catch(e) { 
                    console.log("Insira uma API Key válida para carregar os filmes."); 
                }
            }
        }

        function renderFutebolCards(list) {
            list.forEach(canal => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.innerHTML = `
                    <img src="${canal.poster}" alt="${canal.name}">
                    <div class="card-info">
                        <h3>${canal.name}</h3>
                        <span class="badge live">● AO VIVO</span>
                    </div>
                `;
                card.onclick = () => playLiveStream(canal.name, canal.video_url);
                mainGrid.appendChild(card);
            });
        }

        function renderMediaCards(items) {
            items.forEach(item => {
                const mediaType = item.media_type || (currentTab === 'movie' ? 'movie' : 'tv');
                if (currentTab === 'movie' && mediaType === 'tv') return;
                if (currentTab === 'tv' && mediaType === 'movie') return;

                const title = item.title || item.name;
                const typeLabel = mediaType === 'tv' ? "SÉRIE" : "FILME";
                const poster = item.poster_path ? IMG_URL + item.poster_path : 'https://placehold.co';
                const vote = item.vote_average ? item.vote_average.toFixed(1) : '0.0';

                const card = document.createElement('div');
                card.classList.add('card');
                card.innerHTML = `
                    <img src="${poster}" alt="${title}">
                    <div class="card-info">
                        <h3>${title}</h3>
                        <span class="badge">🎬 ${typeLabel} • ⭐ ${vote}</span>
                    </div>
                `;
